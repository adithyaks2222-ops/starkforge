<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARKFORGE — Logic Gate Simulator</title>
<meta name="description" content="Digital logic gate simulator with real-time Boolean algebra evaluation. Drag-and-drop gates, draw wires, evaluate circuits.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-bg:        #060608;
  --c-surface:   #0b0b0e;
  --c-surface2:  #101014;
  --c-border:    #18181e;
  --c-border2:   #222228;
  --c-text:      #c0c0cc;
  --c-text-dim:  #505060;
  --c-text-faint:#2c2c36;
  --c-accent:    #00d4a0;
  --c-accent-bg: rgba(0,212,160,0.06);
  --c-red:       #d85060;
  --c-red-bg:    rgba(216,80,96,0.06);
  --sidebar-w:   258px;
  --status-h:    34px;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--c-bg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ─── SIDEBAR ─────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100%;
  background: var(--c-surface);
  border-right: 1px solid var(--c-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--c-border);
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-shrink: 0;
}

.sb-logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--c-accent);
}

.sb-version {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--c-text-faint);
  letter-spacing: 0.06em;
}

.sb-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 8px;
}

.sb-body::-webkit-scrollbar { width: 3px; }
.sb-body::-webkit-scrollbar-track { background: transparent; }
.sb-body::-webkit-scrollbar-thumb { background: var(--c-border2); }

.sb-section {
  margin-bottom: 4px;
}

.sb-group-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--c-text-faint);
  text-transform: uppercase;
  padding: 8px 8px 5px;
  display: block;
}

/* Component button — looks like a real tool button, not a card */
.comp-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 6px 8px;
  margin-bottom: 1px;
  background: transparent;
  border: none;
  border-radius: 4px;
  color: var(--c-text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.1s;
  text-align: left;
  user-select: none;
}

.comp-btn:hover {
  background: var(--c-surface2);
}

.comp-btn:active {
  background: var(--c-border);
}

/* The gate icon — a small precise schematic preview */
.comp-btn svg {
  flex-shrink: 0;
  opacity: 0.65;
}

.comp-btn:hover svg { opacity: 1; }

.comp-tag {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.comp-name { color: var(--c-text); font-size: 11.5px; }
.comp-sub  { color: var(--c-text-dim); font-size: 10px; font-family: 'Inter', sans-serif; }

/* Separator */
.sb-sep {
  height: 1px;
  background: var(--c-border);
  margin: 8px 8px;
}

/* Clear button */
.clear-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  width: calc(100% - 16px);
  margin: 0 8px;
  padding: 6px 8px;
  background: transparent;
  border: 1px solid var(--c-border2);
  border-radius: 4px;
  color: var(--c-text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s, color 0.1s;
  user-select: none;
}

.clear-btn:hover {
  background: var(--c-red-bg);
  border-color: rgba(224,80,96,0.3);
  color: var(--c-red);
}

.clear-btn:active { opacity: 0.75; }

/* Keyboard shortcuts */
.sb-shortcuts {
  border-top: 1px solid var(--c-border);
  padding: 10px 8px;
  flex-shrink: 0;
}

.shortcut-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
}

.sc-key {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--c-text-dim);
  background: var(--c-surface2);
  border: 1px solid var(--c-border2);
  border-radius: 3px;
  padding: 1px 5px;
  min-width: 52px;
  text-align: center;
  flex-shrink: 0;
}

.sc-desc {
  font-size: 10px;
  color: var(--c-text-faint);
}

/* ─── WORKSPACE ───────────────────────────────────── */
#workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  /*
    Graph-paper grid: major lines every 80px, minor lines every 20px.
    Pure white lines at very low opacity — no color tint.
  */
  background-color: #060608;
  background-image:
    linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0.007) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.007) 1px, transparent 1px);
  background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
}


#main-canvas {
  position: absolute;
  inset: 0;
  display: block;
  cursor: default;
}

/* ─── STATUS BAR ──────────────────────────────────── */
#statusbar {
  height: var(--status-h);
  min-height: var(--status-h);
  background: var(--c-surface);
  border-top: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 0;
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
}

.sb-seg {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 0 0;
  margin-right: 12px;
  border-right: 1px solid var(--c-border);
}

.sb-seg:last-child { border-right: none; margin-left: auto; padding-right: 0; }

.sb-indicator {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--c-text-faint);
  flex-shrink: 0;
  transition: background 0.2s;
}

.sb-indicator.active { background: var(--c-accent); }

#sb-label {
  color: var(--c-text-faint);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

#sb-eq {
  color: var(--c-text);
  font-size: 12px;
  transition: color 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 400px;
}

#sb-eq.active { color: var(--c-accent); }

#sb-val {
  font-size: 11px;
  font-weight: 500;
  color: var(--c-text-faint);
  transition: color 0.15s;
  letter-spacing: 0.08em;
}

#sb-val.v1 { color: var(--c-accent); }
#sb-val.v0 { color: var(--c-red); }

#sb-hint { color: var(--c-text-faint); font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>

<script>
(function () {
'use strict';

// ─── CONSTANTS ──────────────────────────────────────────────────────────────
// Gate dimensions
const GW = 80, GH = 52;          // gate body width / height
const IN_R  = 24;                  // input node radius
const OUT_R = 28;                  // output node radius
const PR    = 5;                   // port circle radius (drawn)
const PH    = 13;                  // port hit radius
const SNAP  = 48;                  // wire snap distance
const DT    = 4;                   // drag threshold (px)
const NAND_OR_OFFSET = 8;          // bubble offset for NAND/NOR

// Drawing colors — NO glow on inactive, glow only on high state
const C = {
  bg:       '#060608',
  wire0:    '#1e1e24',             // inactive wire: dim, neutral
  wire1:    '#00d4a0',             // active wire: accent
  wireTmp:  'rgba(0,212,160,0.4)',

  // Inactive node
  fill:     '#0c0c10',
  stroke0:  '#323238',
  text0:    '#888898',

  // Active node (state = 1)
  stroke1:  '#00d4a0',
  text1:    '#00d4a0',

  port0:    '#2c2c32',
  portFill0:'rgba(255,255,255,0.025)',
  port1:    '#00d4a0',
  portFill1:'rgba(0,212,160,0.1)',

  redText:  '#d85060',
};

// ─── STATE ──────────────────────────────────────────────────────────────────
let nodes = [], wires = [], uid = 1, drag = null;
let W = 0, H = 0;

const canvas = document.getElementById('main-canvas');
const ctx    = canvas.getContext('2d');
const sbDot  = document.getElementById('sb-dot');
const sbEq   = document.getElementById('sb-eq');
const sbVal  = document.getElementById('sb-val');

// ─── NODE FACTORY ───────────────────────────────────────────────────────────
function mkNode(type, label, x, y) {
  const n = { id: uid++, type, label: label || type, x, y, state: 0, expr: null };
  if (type === 'INPUT') { n.state = 0; n.expr = label || 'IN'; }
  return n;
}

// ─── PORT GEOMETRY ──────────────────────────────────────────────────────────
// Returns array of { x, y, kind:'in'|'out', idx }
function getPorts(node) {
  const { x, y, type } = node;
  switch (type) {
    case 'INPUT':
      return [{ x: x + IN_R,  y, kind:'out', idx:0 }];
    case 'OUTPUT':
      return [{ x: x - OUT_R, y, kind:'in',  idx:0 }];
    case 'NOT':
      return [
        { x: x - GW/2, y, kind:'in',  idx:0 },
        { x: x + GW/2, y, kind:'out', idx:0 },
      ];
    case 'NAND':
      return [
        { x: x - GW/2, y: y - GH*0.22, kind:'in',  idx:0 },
        { x: x - GW/2, y: y + GH*0.22, kind:'in',  idx:1 },
        { x: x + GW/2, y,               kind:'out', idx:0 },
      ];
    case 'NOR':
      return [
        { x: x - GW/2, y: y - GH*0.22, kind:'in',  idx:0 },
        { x: x - GW/2, y: y + GH*0.22, kind:'in',  idx:1 },
        { x: x + GW/2, y,               kind:'out', idx:0 },
      ];
    case 'AND':
    case 'OR':
    case 'XOR':
      return [
        { x: x - GW/2, y: y - GH*0.22, kind:'in',  idx:0 },
        { x: x - GW/2, y: y + GH*0.22, kind:'in',  idx:1 },
        { x: x + GW/2, y,               kind:'out', idx:0 },
      ];
    default:
      return [];
  }
}

function getPort(node, kind, idx) {
  return getPorts(node).find(p => p.kind === kind && p.idx === idx) || null;
}

// ─── HIT TESTING ────────────────────────────────────────────────────────────
function hitNode(node, mx, my) {
  const { x, y, type } = node;
  if (type === 'INPUT') { const d = IN_R + 4; return (mx-x)**2 + (my-y)**2 <= d*d; }
  if (type === 'OUTPUT'){ const d = OUT_R+4; return (mx-x)**2 + (my-y)**2 <= d*d; }
  return mx >= x-GW/2-6 && mx <= x+GW/2+14 && my >= y-GH/2-6 && my <= y+GH/2+6;
}

function hitPort(mx, my) {
  for (let i = nodes.length-1; i >= 0; i--) {
    for (const p of getPorts(nodes[i])) {
      if ((mx-p.x)**2 + (my-p.y)**2 <= PH*PH) return { node: nodes[i], port: p };
    }
  }
  return null;
}

function hitTopNode(mx, my) {
  for (let i = nodes.length-1; i >= 0; i--)
    if (hitNode(nodes[i], mx, my)) return nodes[i];
  return null;
}

// ─── WIRE HELPERS ───────────────────────────────────────────────────────────
function mkWire(fromId, fpi, toId, tpi) { return { id: uid++, fromId, fpi, toId, tpi, state:0 }; }
function clearNodeWires(id)  { wires = wires.filter(w => w.fromId !== id && w.toId !== id); }
function clearPortWire(id, tpi) { wires = wires.filter(w => !(w.toId === id && w.tpi === tpi)); }

function closestInPort(mx, my, exId) {
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (n.id === exId) continue;
    for (const p of getPorts(n)) {
      if (p.kind !== 'in') continue;
      const d = Math.hypot(mx-p.x, my-p.y);
      if (d < bd) { bd = d; best = { node:n, port:p }; }
    }
  }
  return bd <= SNAP ? best : null;
}

// ─── LOGIC ENGINE ───────────────────────────────────────────────────────────
function evaluate() {
  for (const n of nodes) if (n.type !== 'INPUT') { n.state = 0; n.expr = null; }

  let changed = true, guard = nodes.length + 4;
  while (changed && guard-- > 0) {
    changed = false;
    for (const n of nodes) {
      if (n.type === 'INPUT') continue;
      const r = evalNode(n);
      if (r && (n.state !== r.state || n.expr !== r.expr)) {
        n.state = r.state; n.expr = r.expr; changed = true;
      }
    }
  }

  for (const w of wires) {
    const fn = nodes.find(n => n.id === w.fromId);
    w.state = fn ? fn.state : 0;
  }
  updateStatusBar();
}

function inWire(node, pi) { return wires.find(w => w.toId === node.id && w.tpi === pi) || null; }
function srcOf(w)          { return w ? nodes.find(n => n.id === w.fromId) : null; }

function evalNode(node) {
  if (node.type === 'NOT') {
    const s = srcOf(inWire(node, 0));
    if (!s || s.expr === null) return null;
    const e = s.type !== 'INPUT' ? `(${s.expr})` : s.expr;
    return { state: s.state ^ 1, expr: `${e}'` };
  }

  if (node.type === 'OUTPUT') {
    const s = srcOf(inWire(node, 0));
    if (!s || s.expr === null) return null;
    return { state: s.state, expr: s.expr };
  }

  // Two-input gates
  const s0 = srcOf(inWire(node, 0));
  const s1 = srcOf(inWire(node, 1));
  if (!s0 || !s1 || s0.expr === null || s1.expr === null) return null;

  const wrap = (s, parentType) => {
    if (s.type === 'INPUT') return s.expr;
    if (parentType === 'AND' && (s.type === 'OR' || s.type === 'XOR')) return `(${s.expr})`;
    return s.expr;
  };

  const e0 = wrap(s0, node.type), e1 = wrap(s1, node.type);

  switch (node.type) {
    case 'AND':  return { state: s0.state & s1.state,        expr: `${e0}${e1}` };
    case 'OR':   return { state: s0.state | s1.state,        expr: `${e0}+${e1}` };
    case 'NAND': return { state: (s0.state & s1.state) ^ 1,  expr: `(${e0}${e1})'` };
    case 'NOR':  return { state: (s0.state | s1.state) ^ 1,  expr: `(${e0}+${e1})'` };
    case 'XOR':  return { state: s0.state ^ s1.state,        expr: `${e0}⊕${e1}` };
  }
  return null;
}

function updateStatusBar() {
  const out = nodes.find(n => n.type === 'OUTPUT');
  if (!out) {
    sbEq.textContent = 'No output connected';
    sbEq.className = '';
    sbVal.textContent = '';
    sbVal.className = 'sb-val';
    sbDot.className = 'sb-indicator';
    return;
  }
  if (out.expr === null) {
    sbEq.textContent = 'Output has no input';
    sbEq.className = '';
    sbVal.textContent = '';
    sbVal.className = 'sb-val';
    sbDot.className = 'sb-indicator';
    return;
  }
  const on = out.state === 1;
  sbEq.textContent = out.expr;
  sbEq.className = on ? 'active' : '';
  sbVal.textContent = `= ${out.state}`;
  sbVal.className = on ? 'v1' : 'v0';
  sbDot.className = on ? 'sb-indicator active' : 'sb-indicator';
}

// ─── RENDERING ──────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);
  wires.forEach(drawWire);
  if (drag && drag.type === 'wire') {
    const fn = nodes.find(n => n.id === drag.fromId);
    if (fn) {
      const fp = getPort(fn, 'out', drag.fpi);
      if (fp) drawTmpWire(fp.x, fp.y, drag.mx, drag.my);
    }
  }
  nodes.forEach(drawNode);
}

// ── Wires ────────────────────────────────────────────
function bz(x1, y1, x2, y2) {
  const c = Math.max(70, Math.abs(x2-x1) * 0.5);
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(x1+c, y1, x2-c, y2, x2, y2);
}

function drawWire(w) {
  const fn = nodes.find(n => n.id === w.fromId), tn = nodes.find(n => n.id === w.toId);
  if (!fn || !tn) return;
  const fp = getPort(fn, 'out', w.fpi), tp = getPort(tn, 'in', w.tpi);
  if (!fp || !tp) return;
  const on = w.state === 1;

  ctx.save();
  if (on) { ctx.shadowColor = C.wire1; ctx.shadowBlur = 8; }
  ctx.beginPath();
  ctx.strokeStyle = on ? C.wire1 : C.wire0;
  ctx.lineWidth   = on ? 2 : 1.5;
  bz(fp.x, fp.y, tp.x, tp.y);
  ctx.stroke();
  ctx.restore();
}

function drawTmpWire(x1, y1, x2, y2) {
  ctx.save();
  ctx.setLineDash([5,4]);
  ctx.strokeStyle = C.wireTmp;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  bz(x1, y1, x2, y2);
  ctx.stroke();
  ctx.restore();
}

// ── Nodes ────────────────────────────────────────────
function drawNode(n) {
  const on = n.state === 1;
  switch (n.type) {
    case 'INPUT':  drawInput(n, on); break;
    case 'OUTPUT': drawOutput(n, on); break;
    case 'AND':    drawAND(n, on); break;
    case 'OR':     drawOR(n, on); break;
    case 'NOT':    drawNOT(n, on); break;
    case 'NAND':   drawNAND(n, on); break;
    case 'NOR':    drawNOR(n, on); break;
    case 'XOR':    drawXOR(n, on); break;
  }
  getPorts(n).forEach(p => drawPort(p, on, n));
}

// Shared: stroke + fill a shape path
function shapeStyle(on) {
  ctx.fillStyle = C.fill;
  ctx.fill();
  ctx.strokeStyle = on ? C.stroke1 : C.stroke0;
  ctx.lineWidth = on ? 1.8 : 1.4;
  ctx.stroke();
}

// Shared: gate label text
function gateLabel(x, y, text, on) {
  ctx.save();
  ctx.font = '500 9px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = on ? C.text1 : C.text0;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawInput(n, on) {
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 12; }
  ctx.beginPath();
  ctx.arc(n.x, n.y, IN_R, 0, Math.PI*2);
  shapeStyle(on);
  ctx.restore();

  // Label
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 8; }
  ctx.font = '500 14px "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = on ? C.text1 : C.text0;
  ctx.fillText(n.label, n.x, n.y - 2);
  ctx.restore();

  ctx.save();
  ctx.font = '400 10px "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = on ? 'rgba(0,229,176,0.65)' : C.text0 + '55';
  // Note: this appends a hex alpha — just use rgba directly
  ctx.fillStyle = on ? 'rgba(0,229,176,0.6)' : '#383850';
  ctx.fillText(n.state, n.x, n.y + 12);
  ctx.restore();
}

function drawOutput(n, on) {
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 16; }
  ctx.beginPath();
  ctx.arc(n.x, n.y, OUT_R, 0, Math.PI*2);
  shapeStyle(on);
  // Inner ring
  ctx.beginPath();
  ctx.arc(n.x, n.y, OUT_R * 0.5, 0, Math.PI*2);
  ctx.strokeStyle = on ? 'rgba(0,229,176,0.3)' : '#1e1e32';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 8; }
  ctx.font = '500 9px "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = on ? C.text1 : '#4a4a62';
  ctx.fillText('OUT', n.x, n.y - 6);
  ctx.font = '500 13px "JetBrains Mono", monospace';
  ctx.fillStyle = on ? C.text1 : '#383850';
  ctx.fillText(n.state, n.x, n.y + 9);
  ctx.restore();
}

function drawAND(n, on) {
  const { x, y } = n;
  const lx = x - GW/2, rx = x, hw = GH/2;
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 10; }
  ctx.beginPath();
  ctx.moveTo(lx, y - hw);
  ctx.lineTo(rx, y - hw);
  ctx.arc(rx, y, hw, -Math.PI/2, Math.PI/2);
  ctx.lineTo(lx, y + hw);
  ctx.closePath();
  shapeStyle(on);
  ctx.restore();
  gateLabel(x - GW*0.12, y, 'AND', on);
}

function drawOR(n, on) {
  const { x, y } = n;
  const lx = x - GW/2, rx = x + GW/2, hw = GH/2;
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 10; }
  ctx.beginPath();
  ctx.moveTo(lx, y - hw);
  ctx.quadraticCurveTo(lx + GW*0.28, y, lx, y + hw);
  ctx.quadraticCurveTo(lx + GW*0.55, y + hw + 5, rx, y);
  ctx.quadraticCurveTo(lx + GW*0.55, y - hw - 5, lx, y - hw);
  ctx.closePath();
  shapeStyle(on);
  ctx.restore();
  gateLabel(x - GW*0.06, y, 'OR', on);
}

function drawNOT(n, on) {
  const { x, y } = n;
  const lx = x - GW/2, hw = GH/2, bub = 6;
  const tipX = x + GW/2 - bub * 2;
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 10; }
  ctx.beginPath();
  ctx.moveTo(lx, y - hw);
  ctx.lineTo(lx, y + hw);
  ctx.lineTo(tipX, y);
  ctx.closePath();
  shapeStyle(on);
  ctx.beginPath();
  ctx.arc(tipX + bub, y, bub, 0, Math.PI*2);
  shapeStyle(on);
  ctx.restore();
  gateLabel(x - GW*0.14, y, 'NOT', on);
}

function drawNAND(n, on) {
  const { x, y } = n;
  const lx = x - GW/2, hw = GH/2, bub = 6;
  const rx = x + GW/2 - hw - bub * 2;
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 10; }
  ctx.beginPath();
  ctx.moveTo(lx, y - hw);
  ctx.lineTo(rx, y - hw);
  ctx.arc(rx, y, hw, -Math.PI/2, Math.PI/2);
  ctx.lineTo(lx, y + hw);
  ctx.closePath();
  shapeStyle(on);
  ctx.beginPath();
  ctx.arc(rx + hw + bub, y, bub, 0, Math.PI*2);
  shapeStyle(on);
  ctx.restore();
  gateLabel(x - GW*0.12, y, 'NAND', on);
}

function drawNOR(n, on) {
  const { x, y } = n;
  const lx = x - GW/2, rx = x + GW/2, hw = GH/2, bub = 6;
  const tipX = rx - bub * 2;
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 10; }
  ctx.beginPath();
  ctx.moveTo(lx, y - hw);
  ctx.quadraticCurveTo(lx + GW*0.28, y, lx, y + hw);
  ctx.quadraticCurveTo(lx + GW*0.55, y + hw + 5, tipX, y);
  ctx.quadraticCurveTo(lx + GW*0.55, y - hw - 5, lx, y - hw);
  ctx.closePath();
  shapeStyle(on);
  ctx.beginPath();
  ctx.arc(tipX + bub, y, bub, 0, Math.PI*2);
  shapeStyle(on);
  ctx.restore();
  gateLabel(x - GW*0.1, y, 'NOR', on);
}

function drawXOR(n, on) {
  const { x, y } = n;
  const lx = x - GW/2, rx = x + GW/2, hw = GH/2;
  ctx.save();
  if (on) { ctx.shadowColor = C.stroke1; ctx.shadowBlur = 10; }
  // Extra curved back line (the XOR distinguisher)
  ctx.beginPath();
  ctx.moveTo(lx - 6, y - hw);
  ctx.quadraticCurveTo(lx - 6 + GW*0.28, y, lx - 6, y + hw);
  ctx.strokeStyle = on ? C.stroke1 : C.stroke0;
  ctx.lineWidth = on ? 1.8 : 1.4;
  ctx.stroke();
  // Main body (same as OR)
  ctx.beginPath();
  ctx.moveTo(lx, y - hw);
  ctx.quadraticCurveTo(lx + GW*0.28, y, lx, y + hw);
  ctx.quadraticCurveTo(lx + GW*0.55, y + hw + 5, rx, y);
  ctx.quadraticCurveTo(lx + GW*0.55, y - hw - 5, lx, y - hw);
  ctx.closePath();
  shapeStyle(on);
  ctx.restore();
  gateLabel(x - GW*0.06, y, 'XOR', on);
}

function drawPort(p, nodeOn, node) {
  // Gates with inversion bubbles (NOT, NAND, NOR) use the bubble as their output terminal.
  // Skip drawing an extra port circle on their output so there are no duplicate circles.
  if (p.kind === 'out' && (node.type === 'NOT' || node.type === 'NAND' || node.type === 'NOR')) {
    return;
  }

  // A port is "hot" if the node output is active (for out-ports) or
  // if an active wire connects to it (for in-ports)
  let hot = false;
  if (p.kind === 'out') {
    hot = nodeOn;
  } else {
    hot = wires.some(w => w.toId === node.id && w.tpi === p.idx && w.state === 1);
  }

  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, PR, 0, Math.PI*2);
  ctx.fillStyle   = hot ? C.portFill1 : C.portFill0;
  ctx.fill();
  ctx.strokeStyle = hot ? C.port1 : C.port0;
  ctx.lineWidth   = 1.3;
  ctx.stroke();
  ctx.restore();
}

// ─── EVENTS ─────────────────────────────────────────────────────────────────
function xy(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX-r.left, y: e.clientY-r.top }; }

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  const { x, y } = xy(e);

  // Output port → start wire
  const ph = hitPort(x, y);
  if (ph && ph.port.kind === 'out') {
    drag = { type:'wire', fromId: ph.node.id, fpi: ph.port.idx, mx: x, my: y };
    canvas.style.cursor = 'crosshair';
    return;
  }

  // Node → start drag
  const n = hitTopNode(x, y);
  if (n) {
    const i = nodes.indexOf(n); nodes.splice(i,1); nodes.push(n);
    drag = { type:'node', nodeId: n.id, ox: x-n.x, oy: y-n.y, sx: x, sy: y, moved: false };
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mousemove', e => {
  const { x, y } = xy(e);
  if (drag) {
    if (drag.type === 'node') {
      const n = nodes.find(n => n.id === drag.nodeId);
      if (n) {
        if (Math.abs(x-drag.sx) > DT || Math.abs(y-drag.sy) > DT) drag.moved = true;
        n.x = x - drag.ox; n.y = y - drag.oy;
        evaluate(); render();
      }
    } else {
      drag.mx = x; drag.my = y; render();
    }
    return;
  }
  // Cursor hints
  const ph = hitPort(x, y);
  canvas.style.cursor = ph && ph.port.kind === 'out' ? 'crosshair'
    : hitTopNode(x, y) ? 'grab' : 'default';
});

canvas.addEventListener('mouseup', e => {
  const { x, y } = xy(e);
  if (!drag) return;

  if (drag.type === 'node') {
    if (!drag.moved) {
      const n = nodes.find(n => n.id === drag.nodeId);
      if (n && n.type === 'INPUT') { n.state ^= 1; n.expr = n.label; }
    }
    drag = null;
    canvas.style.cursor = 'default';
    evaluate(); render();
    return;
  }

  if (drag.type === 'wire') {
    const { fromId, fpi } = drag;
    drag = null;
    const t = closestInPort(x, y, fromId);
    if (t && t.node.id !== fromId) {
      clearPortWire(t.node.id, t.port.idx);
      wires.push(mkWire(fromId, fpi, t.node.id, t.port.idx));
    }
    canvas.style.cursor = 'default';
    evaluate(); render();
  }
});

canvas.addEventListener('mouseleave', () => {
  if (drag && drag.type === 'wire') { drag = null; render(); }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const { x, y } = xy(e);
  const ph = hitPort(x, y);
  if (ph && ph.port.kind === 'in') {
    clearPortWire(ph.node.id, ph.port.idx);
    evaluate(); render(); return;
  }
  const n = hitTopNode(x, y);
  if (n) { clearNodeWires(n.id); nodes = nodes.filter(x => x.id !== n.id); evaluate(); render(); }
});

// ─── SIDEBAR BUTTONS ────────────────────────────────────────────────────────
document.querySelectorAll('.comp-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const n = mkNode(btn.dataset.type, btn.dataset.label || btn.dataset.type,
      W/2 + (Math.random()-.5)*220, H/2 + (Math.random()-.5)*160);
    nodes.push(n); evaluate(); render();
  });
});

document.getElementById('btn-clear').addEventListener('click', () => {
  nodes = []; wires = []; drag = null; evaluate(); render();
});

// ─── RESIZE ──────────────────────────────────────────────────────────────────
function resize() {
  const wrap = canvas.parentElement;
  const dpr  = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width  = W * dpr; canvas.height  = H * dpr;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  render();
}

window.addEventListener('resize', resize);
resize();

// ─── DEMO CIRCUIT ────────────────────────────────────────────────────────────
(function demo() {
  const cx = W/2, cy = H/2;

  const nA   = mkNode('INPUT',  'A',   cx-230, cy-50);
  const nB   = mkNode('INPUT',  'B',   cx-230, cy+50);
  const nAnd = mkNode('AND',    'AND', cx-50,  cy);
  const nNot = mkNode('NOT',    'NOT', cx+80,  cy);
  const nOut = mkNode('OUTPUT', 'OUT', cx+220, cy);

  nA.state = 1; nA.expr = 'A';
  nB.state = 1; nB.expr = 'B';

  nodes.push(nA, nB, nAnd, nNot, nOut);
  wires.push(mkWire(nA.id, 0, nAnd.id, 0));
  wires.push(mkWire(nB.id, 0, nAnd.id, 1));
  wires.push(mkWire(nAnd.id, 0, nNot.id, 0));
  wires.push(mkWire(nNot.id, 0, nOut.id, 0));

  evaluate(); render();
})();

})();
</script>
